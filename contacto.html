    <main class="formulario-contacto">
        <h2 class="titulo-contacto">Contáctanos</h2>
        <form action="mailto:tuemail@dominio.com" method="post" enctype="text/plain" class="form-contacto">
            <input type="text" name="nombre" placeholder="Tu nombre" required class="input-contacto">
            <input type="email" name="correo" placeholder="Tu correo electrónico" required class="input-contacto">
            <textarea name="mensaje" rows="5" placeholder="Escribe tu mensaje" required class="input-contacto"></textarea>
            <button type="submit" class="boton-contacto">Enviar</button>
        </form>
    </main>
